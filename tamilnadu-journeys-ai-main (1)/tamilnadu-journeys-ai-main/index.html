<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Travel Together — discover Tamil Nadu's iconic landmarks and hidden gems. Plan trips, book buses and lodges, and travel safely." />
    <meta name="theme-color" content="#b45309" />
    <title>Travel Together — Tamil Nadu Trip Planner</title>
    <meta http-equiv="refresh" content="0; url=/" />
    <link rel="canonical" href="/" />
    <style>
      :root { color-scheme: light dark; }
      * { box-sizing: border-box; }
      html, body { margin: 0; padding: 0; height: 100%; }
      body {
        font-family: ui-sans-serif, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        background: linear-gradient(135deg, #fef3c7 0%, #fde68a 50%, #fbbf24 100%);
        color: #1c1917;
        display: flex;
        align-items: center;
        justify-content: center;
        min-height: 100vh;
        padding: 1.5rem;
      }
      main {
        max-width: 32rem;
        background: rgba(255,255,255,0.85);
        backdrop-filter: blur(8px);
        border-radius: 1rem;
        padding: 2.5rem;
        box-shadow: 0 25px 50px -12px rgba(120, 53, 15, 0.25);
        text-align: center;
      }
      h1 {
        font-size: clamp(1.75rem, 4vw, 2.5rem);
        margin: 0 0 0.5rem;
        color: #92400e;
        letter-spacing: -0.02em;
      }
      h1 span { color: #b45309; }
      p { color: #57534e; line-height: 1.6; margin: 0.5rem 0 1.5rem; }
      a.btn {
        display: inline-block;
        padding: 0.75rem 1.5rem;
        background: linear-gradient(135deg, #b45309, #d97706);
        color: white;
        text-decoration: none;
        font-weight: 600;
        border-radius: 0.5rem;
        transition: transform 0.15s ease, box-shadow 0.15s ease;
        box-shadow: 0 10px 20px -5px rgba(180, 83, 9, 0.4);
      }
      a.btn:hover { transform: translateY(-2px); box-shadow: 0 15px 25px -5px rgba(180, 83, 9, 0.5); }
      footer { margin-top: 1.5rem; font-size: 0.85rem; color: #78716c; }
    </style>
  </head>
  <body>
    <main>
      <h1>Travel <span>Together</span></h1>
      <p>Your gateway to Tamil Nadu — iconic temples, hidden hill stations, planned trips, and safer journeys.</p>
      <a class="btn" href="/">Enter the app</a>
      <footer>Redirecting you automatically…</footer>
    </main>
    <script>window.location.replace("/");</script>
  </body>
</html>
